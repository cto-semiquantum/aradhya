<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Time Together ⏳ | For You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="How long we've known each other — counted in days of love.">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/love.css">
</head>

<body>

<canvas id="heartCanvas"></canvas>

<div class="page-wrapper">

    <div class="counter-card">

        <div class="card-shimmer"></div>

        <h1 class="page-title">Our Time Together ⏳</h1>

        <div class="counter-grid">
            <div class="counter-item">
                <div class="counter-emoji">🌸</div>
                <h3>Since We First Met</h3>
                <p class="counter-value" id="metDays">Loading…</p>
                <span class="counter-date">24 June 2024</span>
            </div>

            <div class="counter-item">
                <div class="counter-emoji">💬</div>
                <h3>Since We Became Best Friends</h3>
                <p class="counter-value" id="bestDays">Loading…</p>
                <span class="counter-date">17 September 2024</span>
            </div>

            <div class="counter-item">
                <div class="counter-emoji">✨</div>
                <h3>Since We Reconnected</h3>
                <p class="counter-value" id="reconnectDays">Loading…</p>
                <span class="counter-date">1 February 2026</span>
            </div>
        </div>

        <p class="counter-footer">
            And the story is still being written… 💖
        </p>

        <div class="action-buttons">
            <a href="forever.html" class="glow-btn" id="goForever">Back To Forever ❤️</a>
            <a href="index.html" class="back-link" id="goHome">← Back Home</a>
        </div>

    </div>

</div>

<script src="js/particles.js"></script>
<script src="js/love.js"></script>

</body>
</html>
