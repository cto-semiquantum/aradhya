<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Message in a Bottle 🌊 | Drifting Confessions</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Secret parchment letters sealed in cork glass bottles drifting across the twilight ocean.">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/bottle.css">
<script src="js/auth.js"></script>
</head>

<body>

<!-- PARTICLE HEARTS CANVAS -->
<canvas id="heartCanvas"></canvas>

<div class="page-wrapper">

    <div class="bottle-container">

        <!-- HEADER -->
        <div class="bottle-header">
            <div class="bottle-badge">🌊 Ocean of Memories</div>
            <h1 class="bottle-title">Message in a Bottle</h1>
            <p style="font-size: 14px; color: var(--text-secondary); margin-top: 8px;">
                "Samandar ki lehron par behti hui dil ki aisi baatein... jo sirf tumhare liye hain."
            </p>
        </div>

        <!-- OCEAN VIEWPORT -->
        <div class="ocean-viewport" id="oceanViewport">
            <div class="ocean-wave wave1"></div>
            <div class="ocean-wave wave2"></div>
            <div class="ocean-hint">✨ Tap any floating bottle to uncork its rolled letter</div>
        </div>

        <!-- CAST NEW BOTTLE BOX -->
        <div class="cast-box">
            <div class="cast-title">🍾 Cast A Letter Into The Ocean:</div>
            <textarea id="castInput" class="cast-textarea" placeholder="Ek secret thought likho aur samandar ki lehron me chhod do..."></textarea>
            <button class="cast-btn" id="castBtn">
                <span>Cast Into The Sea</span>
                <span>🌊🍾</span>
            </button>
        </div>

        <!-- BACK HOME -->
        <div>
            <a href="index.html" class="back-link" style="padding: 10px 22px;">← Back Home</a>
        </div>

    </div>

</div>

<!-- PARCHMENT MODAL (ON UNCORk) -->
<div class="parchment-modal" id="parchmentModal">
    <div class="parchment-scroll">
        <div class="scroll-seal">📜</div>
        <div class="scroll-text" id="parchmentText">"..."</div>
        <div class="scroll-author" id="parchmentAuthor">— Harsh 🌊</div>
        <button class="scroll-close-btn" id="parchmentCloseBtn">Roll Back & Close 🕊️</button>
    </div>
</div>

<script src="js/particles.js"></script>
<script src="js/nav.js"></script>
<script src="js/music.js"></script>
<script src="js/bottle.js"></script>

</body>
</html>
