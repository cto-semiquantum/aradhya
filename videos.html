<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Memories 🎥 | For Aradhya</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Precious video moments and photo memories.">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/videos.css">
</head>

<body>

<canvas id="heartCanvas"></canvas>

<div class="page-wrapper">

    <div class="videos-card">

        <h1 class="page-title">Video Memories 🎥</h1>
        <p class="page-subtitle">"Baatein silent ho sakti hain, par yaadein hamesha bolti hain..."</p>

        <!-- VIDEO SECTION -->
        <h2 style="font-size: 20px; color: var(--pink-light); margin-bottom: 20px; text-align: left;">🎬 Video Keepsakes</h2>

        <div class="videos-grid">

            <div class="video-container">
                <div class="video-frame">
                    <video controls playsinline webkit-playsinline preload="metadata">
                        <source src="assets/videos/video1.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="video-caption">"Moments captured in motion... 💖"</div>
            </div>

            <div class="video-container">
                <div class="video-frame">
                    <video controls playsinline webkit-playsinline preload="metadata">
                        <source src="assets/videos/video2.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="video-caption">"A memory that brings a smile every time... ✨"</div>
            </div>

        </div>

        <!-- PHOTO GALLERY SECTION -->
        <h2 style="font-size: 20px; color: var(--pink-light); margin-bottom: 20px; text-align: left;">📸 Special Photo Moments</h2>

        <div class="photo-gallery-grid">

            <div class="photo-frame-card">
                <img src="assets/images/her1.jpeg" alt="Aradhya Photo 1">
                <p class="photo-caption">Unforgettable Smile 🌸</p>
            </div>

            <div class="photo-frame-card">
                <img src="assets/images/her2.jpeg" alt="Aradhya Photo 2">
                <p class="photo-caption">Pure Devotion 💖</p>
            </div>

        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-buttons">
            <a href="her.html" class="glow-btn">About Aradhya 🌸</a>
            <a href="index.html" class="back-link">← Back Home</a>
        </div>

    </div>

</div>

<script src="js/particles.js"></script>
<script src="js/nav.js"></script>
<script src="js/music.js"></script>

</body>
</html>
